<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Uma plataforma abrangente de compartilhamento de conhecimento para aprendizado e crescimento">
    <meta name="author" content="Knowledge Hub Team">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Knowledge Hub">
    <meta property="og:description" content="Uma plataforma abrangente de compartilhamento de conhecimento para aprendizado e crescimento">
    <meta name="twitter:card" content="summary_large_image">
    <title>Knowledge Hub</title>
    <link rel="canonical" href="">
    <link rel="stylesheet" href="css/styles.css">
    <script type="application/ld+json" id="jsonld-data"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js" defer></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para o conteudo principal</a>

    <header class="site-header" role="banner">
        <div class="container header-inner">
            <a href="#/" class="site-logo" aria-label="Knowledge Hub - Pagina Inicial">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span class="logo-text">Knowledge Hub</span>
            </a>
            <nav class="site-nav" role="navigation" aria-label="Navegacao principal">
                <a href="#/" class="nav-link">Inicio</a>
            </nav>
            <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo escuro" title="Alternar modo escuro">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <nav class="breadcrumb-nav" id="breadcrumb-nav" aria-label="Caminho de navegacao" hidden>
        <div class="container">
            <ol class="breadcrumb" id="breadcrumb" itemscope itemtype="https://schema.org/BreadcrumbList"></ol>
        </div>
    </nav>

    <main id="main-content" class="container main-content" role="main">
        <div id="app-root"></div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container footer-inner">
            <p>&copy; <span id="footer-year"></span> Knowledge Hub. Feito para o aprendizado.</p>
        </div>
    </footer>

    <script src="js/progress.js"></script>
    <script src="js/seo.js"></script>
    <script src="js/content.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
